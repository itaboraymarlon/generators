<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Gerador de Tweet</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: #0f1115;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #e7e9ea;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 16px 80px;
    gap: 32px;
  }

  h1 {
    font-size: 18px;
    font-weight: 600;
    color: #71767b;
    letter-spacing: 0.02em;
    margin: 0;
  }

  /* ---------- CARD ---------- */
  #card {
    width: 550px;
    max-width: 90vw;
    background: #000;
    border-radius: 28px;
    padding: 32px 36px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  .tweet-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .user-block {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  #avatarPreview {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    object-fit: cover;
    background: #333;
    flex-shrink: 0;
  }

  .name-handle {
    display: flex;
    flex-direction: column;
    line-height: 1.25;
  }

  #namePreview {
    font-weight: 800;
    font-size: 20px;
    color: #fff;
    word-break: break-word;
  }

  #handlePreview {
    font-size: 17px;
    color: #71767b;
  }

  #textPreview {
    font-size: 24px;
    line-height: 1.35;
    color: #fff;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .meta {
    font-size: 16px;
    color: #71767b;
  }

  .emoji-picker-wrap {
    position: relative;
    flex-shrink: 0;
  }

  #emojiBtn {
    background: transparent;
    border: none;
    font-size: 28px;
    line-height: 1;
    cursor: text;
    padding: 2px 6px;
    border-radius: 8px;
    outline: none;
    min-width: 1ch;
  }

  #emojiBtn:hover, #emojiBtn:focus {
    background: rgba(255, 255, 255, 0.08);
  }

  /* ---------- FORM ---------- */
  #form {
    width: 550px;
    max-width: 90vw;
    background: #1a1d24;
    border-radius: 20px;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  label {
    font-size: 13px;
    color: #8b98a5;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-bottom: 6px;
    display: block;
  }

  input[type="text"], textarea {
    width: 100%;
    background: #15181c;
    border: 1px solid #2f3336;
    border-radius: 10px;
    color: #e7e9ea;
    padding: 10px 12px;
    font-size: 15px;
    font-family: inherit;
    resize: vertical;
    outline: none;
  }

  input[type="text"]:focus, textarea:focus {
    border-color: #1d9bf0;
  }

  .field {
    display: flex;
    flex-direction: column;
  }

  .handle-fixed {
    font-size: 14px;
    color: #71767b;
    margin-top: 4px;
  }

  .upload-row {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .upload-btn {
    background: #2f3336;
    color: #e7e9ea;
    border: none;
    padding: 8px 14px;
    border-radius: 999px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }

  .upload-btn:hover { background: #3a3f42; }

  #avatarInput { display: none; }

  #exportBtn {
    margin-top: 8px;
    background: #1d9bf0;
    color: #fff;
    border: none;
    padding: 12px 20px;
    border-radius: 999px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
  }

  #exportBtn:hover { background: #1a8cd8; }
  #exportBtn:disabled { opacity: 0.6; cursor: default; }
</style>
</head>
<body>

<h1>gerador de tweet</h1>

<!-- CARD (o que vira a imagem exportada) -->
<div id="card">
  <div class="tweet-header">
    <div class="user-block">
      <img id="avatarPreview" src="" alt="avatar">
      <div class="name-handle">
        <span id="namePreview">user</span>
        <span id="handlePreview">@desgramarlon</span>
      </div>
    </div>
    <div class="emoji-picker-wrap">
      <span id="emojiBtn" contenteditable="true" spellcheck="false" title="Clique e digite/cole qualquer emoji">🙂</span>
    </div>
  </div>

  <div id="textPreview"></div>

  <div class="meta" id="metaPreviewText">xx:xx dd/mm/aaaa</div>
</div>

<!-- FORMULÁRIO -->
<div id="form">
  <div class="field">
    <label for="nameInput">Nome de exibição</label>
    <input type="text" id="nameInput" placeholder="user">
    <div class="handle-fixed">@desgramarlon (fixo)</div>
  </div>

  <div class="field">
    <label>Foto de perfil</label>
    <div class="upload-row">
      <button class="upload-btn" id="uploadTrigger">Escolher imagem</button>
      <input type="file" id="avatarInput" accept="image/*">
    </div>
  </div>

  <div class="field">
    <label for="textInput">Texto do tweet</label>
    <textarea id="textInput" rows="3" placeholder="Digite o texto do tweet..."></textarea>
  </div>

  <div class="field">
    <label for="metaInput">Data e hora (automático)</label>
    <input type="text" id="metaInput" readonly>
  </div>

  <button id="exportBtn">Exportar PNG</button>
</div>

<script>
  const nameInput = document.getElementById('nameInput');
  const textInput = document.getElementById('textInput');
  const metaInput = document.getElementById('metaInput');
  const avatarInput = document.getElementById('avatarInput');
  const uploadTrigger = document.getElementById('uploadTrigger');

  const namePreview = document.getElementById('namePreview');
  const textPreview = document.getElementById('textPreview');
  const metaPreview = document.querySelector('.meta');
  const avatarPreview = document.getElementById('avatarPreview');

  // avatar padrão (gerado localmente, sem depender de rede)
  function defaultAvatar() {
    const c = document.createElement('canvas');
    c.width = 112; c.height = 112;
    const ctx = c.getContext('2d');
    const grad = ctx.createLinearGradient(0, 0, 112, 112);
    grad.addColorStop(0, '#833ab4');
    grad.addColorStop(1, '#fd1d1d');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, 112, 112);
    return c.toDataURL('image/png');
  }
  avatarPreview.src = defaultAvatar();

  nameInput.addEventListener('input', () => {
    namePreview.textContent = nameInput.value || 'user';
  });

  textInput.addEventListener('input', () => {
    textPreview.textContent = textInput.value;
  });

  metaInput.addEventListener('input', () => {
    metaPreview.textContent = metaInput.value || 'xx:xx dd/mm/aaaa';
  });

  function pad(n) { return String(n).padStart(2, '0'); }

  function setCurrentDateTime() {
    const now = new Date();
    const formatted = `${pad(now.getHours())}:${pad(now.getMinutes())} • ${pad(now.getDate())}/${pad(now.getMonth() + 1)}/${now.getFullYear()}`;
    metaInput.value = formatted;
    metaPreview.textContent = formatted;
  }
  setCurrentDateTime();

  uploadTrigger.addEventListener('click', () => avatarInput.click());

  avatarInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      avatarPreview.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  });

  function isIOS() {
    return /iP(hone|od|ad)/.test(navigator.userAgent) ||
      (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  }

  document.getElementById('exportBtn').addEventListener('click', async () => {
    const btn = document.getElementById('exportBtn');
    btn.disabled = true;
    btn.textContent = 'Exportando...';
    emojiBtn.blur();

    // No iOS/Safari, downloads programáticos só funcionam se a janela for
    // aberta de forma síncrona, dentro do próprio clique do usuário.
    const iosFallbackTab = isIOS() ? window.open('', '_blank') : null;

    try {
      const card = document.getElementById('card');
      const canvas = await html2canvas(card, {
        backgroundColor: null,
        scale: 2,
        useCORS: true
      });

      canvas.toBlob((blob) => {
        if (!blob) {
          alert('Não foi possível gerar a imagem. Tente novamente.');
          if (iosFallbackTab) iosFallbackTab.close();
          return;
        }

        const url = URL.createObjectURL(blob);

        if (iosFallbackTab) {
          // Abre a imagem numa aba nova: no iOS o usuário salva com
          // toque longo > "Adicionar à Fotos" / "Salvar Imagem".
          iosFallbackTab.location.href = url;
        } else {
          const link = document.createElement('a');
          link.download = 'tweet.png';
          link.href = url;
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
        }

        setTimeout(() => URL.revokeObjectURL(url), 30000);
      }, 'image/png');
    } catch (err) {
      if (iosFallbackTab) iosFallbackTab.close();
      alert('Erro ao exportar: ' + err.message);
    } finally {
      btn.disabled = false;
      btn.textContent = 'Exportar PNG';
    }
  });

  // ---------- Seletor de emoji (campo editável livre) ----------
  const emojiBtn = document.getElementById('emojiBtn');

  // seleciona o conteúdo ao focar, pra facilitar substituir por outro emoji
  emojiBtn.addEventListener('focus', () => {
    const range = document.createRange();
    range.selectNodeContents(emojiBtn);
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  });

  // impede quebra de linha ao apertar Enter
  emojiBtn.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      emojiBtn.blur();
    }
  });

  // limita para não deixar o campo vazio
  emojiBtn.addEventListener('blur', () => {
    if (!emojiBtn.textContent.trim()) {
      emojiBtn.textContent = '🙂';
    }
  });
</script>

</body>
</html>
